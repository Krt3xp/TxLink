[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taxlink-nfse-collector"
version = "0.1.0"
description = "Coletor de NFS-e do Ambiente de Dados Nacional para o TaxLink"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "requests>=2.31.0",
]

[project.scripts]
taxlink-nfse = "taxlink_nfse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

